<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work | Olujola Samuel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- fonts load without blocking the page -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@400;500;700&family=Instrument+Serif:ital@1&family=Mrs+Saint+Delafield&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@400;500;700&family=Instrument+Serif:ital@1&family=Mrs+Saint+Delafield&display=swap" /></noscript>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --page: #ffffff;
      --ink: #161616;
      --muted: #55575b;
      --line: #e4e4e2;
      --accent: #ff6a2b;   /* flower orange: underline + full stop on the name */
      --head: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;   /* headers */
      --body: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;         /* subtext + everything else */
      --sans: var(--body);
      --mono: var(--body);
    }

    html { scroll-behavior: smooth; }

    html, body {
      background: var(--page);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    /* =====================================================
       TOP BAR  (identity · pill nav · clock + actions)
       ===================================================== */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      height: 66px;
      padding: 0 7.8vw;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
    }

    .who { display: block; justify-self: start; text-decoration: none; }

    /* same drawing as the loader, so the name can land on it exactly */
    .who-sig {
      display: block;
      width: 200px;
      height: 80px;
      margin: -13px 0 -1px -44px;
      overflow: visible;
      opacity: 0;
    }

    body.landed .who-sig { opacity: 1; }

    .who-line {
      fill: none;
      stroke: var(--accent);
      stroke-width: 6;
      stroke-linecap: round;
    }

    .who-sig text {
      font-family: "Mrs Saint Delafield", cursive;
      font-size: 220px;
      fill: var(--ink);
      stroke: var(--ink);
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .seg {
      display: flex; gap: 2px;
      padding: 4px;
      background: #f8f8f7;
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    .seg a {
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 500;
      color: #6a6a6a;
      text-decoration: none;
      border-radius: 999px;
      border: 1px solid transparent;
      transition: color 0.2s, background 0.2s;
    }

    .seg a:hover { color: var(--ink); }
    .seg a.on { background: #fff; color: var(--ink); border-color: var(--line); box-shadow: 0 1px 2px rgba(0,0,0,0.04); }

    .tools { display: flex; align-items: center; gap: 10px; justify-self: end; }

    .pill {
      height: 36px;
      padding: 0 16px;
      display: inline-flex; align-items: center; gap: 6px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-size: 14px; font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
    }

    .pill span { font-size: 12px; color: #3a5bd0; }
    .pill.dark { background: #0f0f0f; border-color: #0f0f0f; color: #fff; font-weight: 600; }
    .pill:hover { opacity: 0.85; }

    /* =====================================================
       WORK  (intro + case rows)
       ===================================================== */
    .work {
      position: relative;
      background: #efefea;
      padding: 120px 7.8vw 120px;
    }

    .work-lines {
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 640px;
      pointer-events: none;
    }

    .work-lines path { fill: none; stroke: rgba(0, 0, 0, 0.055); stroke-width: 1.2; }

    .work-top { position: relative; margin: 0 auto 48px; max-width: 1240px; }

    .btn-out {
      height: 48px; padding: 0 30px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid #141414;
      border-radius: 999px;
      color: #141414;
      text-decoration: none;
      font-size: 16px;
      transition: background 0.25s, color 0.25s;
    }

    .btn-out:hover { background: #141414; color: #fff; }

    .work-more { position: relative; display: flex; justify-content: center; margin-top: 56px; }

    /* two tiles per row, edge to edge: big colour panels with the work inside, name + description underneath */
    .cases {
      position: relative;
      max-width: 1240px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 44px 14px;
      padding-bottom: 20px;
    }

    .cases .case {
      position: relative;
      display: flex; flex-direction: column;
      translate: 0 var(--lift, 0px);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1), translate 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    /* hover: the tile pops up a little */
    .cases .case:hover { --lift: -10px; }
    .case:hover .shot { box-shadow: 0 36px 60px -30px rgba(0, 0, 0, 0.4); }
    .case .shot .phones, .case .shot .browser { transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1); }
    .case:hover .shot .phones, .case:hover .shot .browser { transform: translateY(-8px) scale(1.02); }
    .case .shot > img { transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1); }
    .case:hover .shot > img { transform: scale(1.04); }

    .shot {
      position: relative;
      aspect-ratio: 1.28;
      border-radius: 12px;
      overflow: hidden;
      background: var(--g);
      display: flex; align-items: flex-end; justify-content: center;
      transition: box-shadow 0.35s ease;
    }

    .shot > img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* round arrow that appears on hover */
    .case .go {
      position: absolute; top: 16px; right: 16px;
      width: 42px; height: 42px; border-radius: 50%;
      background: #fff; color: #141414;
      display: grid; place-items: center;
      font-size: 17px;
      opacity: 0; transform: scale(0.8);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 2;
    }

    .case:hover .go { opacity: 1; transform: none; }

    .case-meta { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 2px 0; }

    .case h3 {
      font-family: var(--head);
      font-weight: 500;
      font-size: 22px;
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .tags { list-style: none; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .tags li { font-size: 12px; font-weight: 500; padding: 5px 11px; border-radius: 999px; border: 1px solid #d3d3cc; color: #55554f; }

    .case-desc { padding: 8px 2px 0; font-size: 14px; line-height: 1.55; color: #77776f; max-width: 520px; }

    /* the whole tile is the link */
    .case-link { position: absolute; inset: 0; z-index: 3; }

    /* browser-window placeholder (swap for your screenshot via img) */
    .browser {
      width: 86%; height: 78%;
      align-self: center;
      border-radius: 10px;
      overflow: hidden;
      background: var(--ph, #fff);
      box-shadow: 0 24px 50px -20px rgba(0, 0, 0, 0.45);
    }

    .browser .bar { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--bar, rgba(0, 0, 0, 0.08)); }
    .browser .bar span { width: 8px; height: 8px; border-radius: 50%; background: var(--bar, rgba(0, 0, 0, 0.14)); }
    .browser .pg { padding: 18px 20px; }
    .browser .pg b { display: block; width: 56%; height: 16px; border-radius: 5px; background: var(--a); margin-bottom: 12px; }
    .browser .pg i { display: block; height: 8px; width: 80%; border-radius: 4px; background: var(--bar, rgba(0, 0, 0, 0.08)); margin-bottom: 8px; }
    .browser .pg i:nth-of-type(2) { width: 62%; }
    .browser .blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
    .browser .blocks u { display: block; height: 74px; border-radius: 8px; background: var(--bar, rgba(0, 0, 0, 0.07)); }
    .browser .blocks u:first-child { background: var(--a); opacity: 0.9; }

    /* placeholder devices: replace by setting img in the PROJECTS list (script) */
    .phones { display: flex; align-items: flex-end; gap: 4%; width: 74%; height: 86%; }

    .phone {
      flex: 1; height: 80%;
      padding: 10px;
      border-radius: 24px 24px 0 0;
      background: var(--ph, #fff);
      box-shadow: 0 20px 40px -18px rgba(0, 0, 0, 0.35);
    }

    .phone.main { flex: 1.2; height: 100%; }
    .phone b { display: block; height: 34%; border-radius: 14px; background: var(--a); margin-bottom: 10px; }
    .phone i { display: block; height: 8px; border-radius: 4px; background: var(--bar, rgba(0, 0, 0, 0.08)); margin-bottom: 8px; }
    .phone i:nth-child(odd) { width: 70%; }

    .reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1); }
    .reveal.in { opacity: 1; transform: none; }

    @media (max-width: 900px) {
      .work { padding: 90px 5vw 80px; }
      .cases { grid-template-columns: 1fr; gap: 34px; padding-bottom: 0; }
      .work-more { margin-top: 40px; }
    }

    /* =====================================================
       FOOTER
       ===================================================== */
    .foot { background: #efefea; color: #141414; padding: 110px 7.8vw 44px; }
    .foot-in { max-width: 1240px; margin: 0 auto; }

    .foot-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; flex-wrap: wrap; }

    .foot-title {
      font-family: var(--head);
      font-weight: 400;
      font-size: clamp(2.4rem, 5.4vw, 4.8rem);
      line-height: 1.02;
      letter-spacing: -0.05em;
    }

    .foot-title em {
      display: block;
      font: inherit;              /* same font, size and weight as "Have a product in mind?" */
      letter-spacing: inherit;
      color: var(--accent);
    }

    /* "Email me" button in the footer */
    .foot .reach {
      display: inline-flex; align-items: center; height: 48px; gap: 10px;
      margin-top: 28px; padding: 0 30px; border-radius: 999px;
      background: #0f0f0f; color: #fff; font-size: 16px; font-weight: 400;
      text-decoration: none; transition: opacity 0.2s;
    }
    .foot .reach:hover { opacity: 0.85; }

    .foot-cta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .foot-cta .reach { margin-top: 0; }

    /* copy-email button */
    .copy {
      position: relative;
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1px solid #141414;
      background: transparent;
      color: #141414;
      display: grid; place-items: center;
      cursor: pointer;
      transition: background 0.25s, color 0.25s;
    }

    .copy:hover { background: #141414; color: #fff; }
    .copy svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .copy .ok { display: none; }
    .copy.done .cp { display: none; }
    .copy.done .ok { display: block; }

    .copy::after {
      content: "Copied!";
      position: absolute; bottom: calc(100% + 10px); left: 50%;
      padding: 5px 10px; border-radius: 6px;
      background: #141414; color: #fff; font-size: 12px; white-space: nowrap;
      opacity: 0; transform: translate(-50%, 4px); pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .copy.done::after { opacity: 1; transform: translate(-50%, 0); }

    .foot-bottom {
      margin-top: 90px;
      padding-top: 26px;
      border-top: 1px solid rgba(0, 0, 0, 0.12);
      display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap;
      font-size: 14px; color: #77776f;
    }

    .foot-social { display: flex; gap: 28px; }
    .foot-social a { color: #141414; text-decoration: none; padding-bottom: 2px; border-bottom: 1px solid transparent; transition: color 0.25s, border-color 0.25s; }
    .foot-social a:hover { color: var(--accent); border-color: var(--accent); }

    @media (max-width: 900px) {
      .foot { padding: 80px 5vw 36px; }
      .foot-bottom { margin-top: 56px; }
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */
    @media (max-width: 960px) {
      .hero {
        height: auto;
        min-height: 100vh;
        padding: 680px 6vw 40vw;
        display: flex;
        flex-direction: column;
      }
      .hero-copy { position: relative; left: auto; top: auto; }
      .hero h1 { font-size: clamp(2.2rem, 9vw, 3.6rem); }
    }

    @media (max-width: 900px) {
      .topbar { padding: 0 5vw; }
    }

    /* =====================================================
       MOBILE MENU (hamburger)
       ===================================================== */
    .burger { display: none; }
    .menu { display: none; }

    @media (max-width: 760px) {
      .topbar { grid-template-columns: 1fr auto; }
      .topbar > .seg, .topbar > .tools { display: none; }

      .burger {
        display: inline-flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
        width: 42px; height: 42px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
        justify-self: end;
      }

      .burger span {
        display: block; width: 18px; height: 1.5px; background: var(--ink); border-radius: 2px;
        transition: transform 0.3s ease, opacity 0.2s ease;
      }

      .burger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
      .burger.open span:nth-child(2) { opacity: 0; }
      .burger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

      .menu {
        display: flex; flex-direction: column; gap: 6px;
        position: fixed; top: 66px; left: 0; right: 0;
        z-index: 49;
        padding: 14px 5vw 24px;
        background: rgba(255, 255, 255, 0.97);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
        box-shadow: 0 24px 40px -24px rgba(0, 0, 0, 0.25);
        opacity: 0; visibility: hidden; transform: translateY(-10px);
        transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
      }

      .menu.open { opacity: 1; visibility: visible; transform: none; }

      .menu a.lnk {
        padding: 14px 4px;
        font-family: var(--head);
        font-size: 22px; font-weight: 500; letter-spacing: -0.03em;
        color: var(--ink); text-decoration: none;
        border-bottom: 1px solid var(--line);
      }

      .menu a.lnk.on { color: var(--accent); }

      .menu a.pill { margin-top: 14px; height: 48px; justify-content: center; font-size: 16px; }
    }

    @media (max-width: 600px) {
      .who-sig { width: 150px; height: 60px; margin: -10px 0 0 -20px; }
      .seg a { padding: 8px 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition-duration: 0.01s; }
    }

    /* ---------- Work page ---------- */
    .work { padding-top: 150px; }
    .work-top { margin-bottom: 40px; }
    .work h2 {
      font-family: var(--head); font-weight: 400;
      font-size: clamp(1.9rem, 3.1vw, 2.7rem);
      line-height: 1.08; letter-spacing: -0.045em; color: #141414;
    }
    @media (max-width: 900px) { .work { padding-top: 120px; } }
  </style>
</head>

  <script>
    /* =====================================================
       YOUR PROJECTS: edit this list. The Work page (work.html)
       has the same list, so change both when you edit.
       title, desc, tags → text on each card
       img               → cover image (e.g. IMGs/cino.png)
       href              → the case study page the card opens
       ===================================================== */
    const PROJECTS = [
      { title: "Cino Wallet",   desc: "A short line about the problem you solved and what you designed.",
        img: "IMGs/cino.png",
        href: "case-cino.html",
        tags: ["Mobile App", "Web3"], kind: "phones",     g: "linear-gradient(160deg,#4d8dff,#1f5fe0)", a: "#2f6cf0" },
      { title: "BaseConnect",   desc: "A short line about the users, the constraints and the result.",
        img: "IMGs/BaseConnect.png",
        href: "case-baseconnect.html",
        tags: ["Web App", "Dashboard"], kind: "browser",     g: "linear-gradient(160deg,#d8ff5a,#9be02a)", a: "#1b1b1b", dark: true },
      { title: "AttendeeHRM", desc: "A short line about the system, the flows and what changed.",
        img: "IMGs/AttendeeHRM.png",
        href: "case-attendeehrm.html",
        tags: ["Website Design", " Saas"], kind: "browser",       g: "linear-gradient(160deg,#ffb36b,#ff7a45)", a: "#ff7a45" },
      { title: "Ocean Pieces",  desc: "A live site you designed and built in code, in a sentence.",
        img: "IMGs/OceanPieces.png",
        href: "case-ocean.html",
        tags: ["Website Design", "E-commerce"], kind: "phones",  g: "linear-gradient(160deg,#b9a2ff,#7a5cf0)", a: "#7a5cf0" }
    ];

    (function buildCases() {
      const host = document.getElementById("cases");
      const phone = (cls) => `<div class="phone ${cls}"><b></b><i></i><i></i><i></i><i></i></div>`;
      const browser = `<div class="browser"><div class="bar"><span></span><span></span><span></span></div>
        <div class="pg"><b></b><i></i><i></i><div class="blocks"><u></u><u></u><u></u></div></div></div>`;
      host.innerHTML = PROJECTS.map((p, i) => {
        const media = p.img
          ? `<img src="${p.img}" alt="${p.title}" />`
          : p.kind === "browser" ? browser
          : `<div class="phones">${phone("")}${phone("main")}${phone("")}</div>`;
        const dark = p.dark ? "--ph:#161616;--bar:rgba(255,255,255,0.14);" : "";
        return `
        <article class="case reveal" style="transition-delay:${(i % 2) * 120}ms">
          <div class="shot" style="--g:${p.g};--a:${p.a};${dark}">
            ${media}
            <span class="go" aria-hidden="true">↗</span>
          </div>
          <div class="case-meta">
            <h3>${p.title}</h3>
            <ul class="tags">${p.tags.map(t => `<li>${t.trim()}</li>`).join("")}</ul>
          </div>
          <p class="case-desc">${p.desc}</p>
          <a class="case-link" href="${p.href || '#'}" aria-label="View ${p.title} case study"></a>
        </article>`;
      }).join("");
    })();

    /* hamburger menu (mobile) */
    (function mobileMenu() {
      const burger = document.getElementById("burger"), menu = document.getElementById("menu");
      const set = (open) => {
        burger.classList.toggle("open", open);
        menu.classList.toggle("open", open);
        burger.setAttribute("aria-expanded", open);
        burger.setAttribute("aria-label", open ? "Close menu" : "Open menu");
      };
      burger.addEventListener("click", () => set(!menu.classList.contains("open")));
      menu.querySelectorAll("a").forEach(a => a.addEventListener("click", () => set(false)));
      window.addEventListener("resize", () => { if (window.innerWidth > 760) set(false); });
    })();

    /* copy email button (reads the address from the Email me link) */
    (function copyEmail() {
      const btn = document.getElementById("copyEmail");
      const email = document.getElementById("emailLink").getAttribute("href").replace("mailto:", "");
      btn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(email);
        } catch (err) {
          const t = document.createElement("textarea");
          t.value = email; t.style.position = "fixed"; t.style.opacity = "0";
          document.body.appendChild(t); t.select();
          try { document.execCommand("copy"); } catch (e) {}
          t.remove();
        }
        btn.classList.add("done");
        clearTimeout(copyEmail.t);
        copyEmail.t = setTimeout(() => btn.classList.remove("done"), 1800);
      });
    })();

    (function scrollFx() {
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
      }, { threshold: 0.12 });
      document.querySelectorAll(".reveal").forEach(el => io.observe(el));
    })();
  </script>
</body>
</html>
